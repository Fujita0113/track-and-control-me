schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-artifact rules
rules:
  specs:
    - |
      シナリオは「起きること」で書く。UI の表示名・ボタンの位置・要素の個数を
      SHALL / MUST NOT で凍結しない。これらは実装中に発明されるもので、propose で
      先に固めると、apply がより直感的な UI に気づいても delta spec が「触るの禁止」
      であるために動かせず、文言に合わせるだけのゴチャゴチャした UI が残る。
    - |
      凍結してよいのは振る舞い。到達できる / できない、API の有無と拒否条件、
      計算規則、状態遷移、データの数え方。表示語彙は実装者の裁量に残す。
      例: 「レポート画面は廃止し、進行中・完走後のいずれからも到達できない」は書いてよい。
      「利用者に見える名称は『見通し』SHALL とし『レポートプレビュー』を表示してはならない」は書かない。
    - |
      例外: 視覚要件は ref/ の参照実装を指して書いてよい（むしろ推奨）。
      「ref/kanban.html のカード構造に合わせる」「ref/timeline.png の目盛り表現に従う」の
      ように、ref/*.html・ref/*.png を名指しする形なら、完成像が実在するので
      文言や構造の先出しにはならない。参照実装が無い UI については上のルールどおり書かない。
